name: hackathon-ai-agent
version: 1.0.0
description: "SigNoz AI Hackathon - Autonomous Neural Optimizer (ANO)"
dependencies:
  - langchain
  - langchain-core
  - langchain-openai
  - openinference-instrumentation-langchain
  - opentelemetry-api
