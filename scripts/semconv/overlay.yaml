# SigNoz semantic-convention rollout policy.
#
# Families are keyed by their current OpenTelemetry name. Schema-derived
# families are disabled by default so rollout remains explicit and reversible.
# The signals list is the per-family rollout gate.
default_enabled: false

families:
  deployment.environment.name:
    enabled: true
    signals: [traces, logs, metrics]
    # The family names an attribute of the resource or the span/log, never a
    # field inside a log body: without this gate a body-context key with the
    # same path joins the family and skips the body-JSON machinery.
    contexts: [resource, attribute]
  db.system.name:
    # The db.system value domain also renamed (mssql -> microsoft.sql_server
    # and others), and no value mapping is read yet. A name-only merge matches
    # half the history on every signal, so the family stays off until a
    # value-mapping reader exists.
    enabled: false
  db.namespace:
    enabled: true
  db.operation.name:
    enabled: true
  db.query.text:
    enabled: true

  rpc.system.name:
    enabled: true
  service.peer.name:
    enabled: true

  messaging.destination.name:
    enabled: true
  messaging.operation.type:
    enabled: true
  messaging.consumer.group.name:
    enabled: true
  # The schema records the client_id rename under metrics only, but span
  # SDKs emitted messaging.client_id as well.
  messaging.client.id:
    enabled: true
    add_signals: [traces]

  container.runtime.name:
    enabled: true
  code.file.path:
    enabled: true
  code.function.name:
    enabled: true
  code.line.number:
    enabled: true

  # The HTTP renames were published for spans, but the same attributes are
  # routinely copied onto correlated logs. Widening them here makes trace and
  # log queries behave consistently during mixed-SDK migrations.
  http.request.method:
    enabled: true
    add_signals: [logs]
  http.response.status_code:
    enabled: true
    add_signals: [logs]
  url.full:
    enabled: true
    add_signals: [logs]
  url.scheme:
    enabled: true
    add_signals: [logs]
  user_agent.original:
    enabled: true
    contexts: [attribute]
    signals: [traces, logs]

  # Disabled audit-priority families. These are not safe name-only aliases:
  # protocol-specific RPC status fields use different value domains, while
  # the older network peer/host names are role-dependent and can map to
  # client, server, or socket addresses. Their collector-specific fallbacks
  # remain in place until they have an explicit value/role migration.
  rpc.response.status_code:
    enabled: false
  server.address:
    enabled: false
  # network.peer.address is intentionally not declared as a family: the
  # schema history explicitly says net.sock.peer.addr cannot be mapped by
  # name alone because its client/server role is ambiguous.

  # These metric renames predate the vendored schema history, so the overlay
  # declares the old names itself.
  k8s.pod.cpu.usage:
    enabled: true
    kind: metric
    old: [k8s.pod.cpu.utilization]
  k8s.node.cpu.usage:
    enabled: true
    kind: metric
    old: [k8s.node.cpu.utilization]
  container.cpu.usage:
    enabled: true
    kind: metric
    old: [container.cpu.utilization]
