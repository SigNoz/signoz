<!--
	Third-party frames are the one thing msw cannot answer: a cross-origin iframe
	navigates outside the service worker's scope, so the YouTube embeds and the
	docs pane in onboarding reach the real network. Same intent as the boot data
	below, enforced by the browser instead.
-->
<meta
	http-equiv="Content-Security-Policy"
	content="frame-src 'self' blob: data:"
/>

<!--
	`index.html` links Inter from Google Fonts here. The link is parsed before the
	msw worker has started, so that one request escapes the iframe while every
	other font request the app makes is answered with an empty stylesheet; the
	local faces stand in for both.
-->
<link rel="stylesheet" href="storybook-fonts.css" />

<link rel="stylesheet" href="css/uPlot.min.css" />

<script>
	// i18n's language detector would pick the browser locale (e.g. `en-US`), which
	// /public/locales does not ship; pin it to the bundled language instead.
	window.localStorage.setItem('i18nextLng', 'en');

	// The Go backend injects this at boot; every integration it enables is off in
	// Storybook so no third-party script loads inside the iframe.
	window.signozBootData = {
		settings: {
			posthog: { enabled: false, apiHost: '', key: '', uiHost: '' },
			appcues: { enabled: false, appId: '' },
			sentry: { enabled: false, dsn: '', tunnel: '' },
			pylon: { enabled: false, appId: '', identitySecret: '' },
		},
	};
</script>
