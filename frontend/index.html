<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<base href="[[.BaseHref]]" />
		<script id="signoz-boot-guard">
			(function () {
				function render(kind) {
					if (document.getElementById('signoz-boot-error')) return;
					var light = document.body.classList.contains('lightMode');
					var box = document.createElement('div');
					box.id = 'signoz-boot-error';
					box.setAttribute('role', 'alert');
					box.setAttribute('data-testid', 'boot-error');
					box.style.cssText =
						'position:fixed;top:0;right:0;bottom:0;left:0;z-index:2147483647;display:flex;' +
						'flex-direction:column;align-items:center;justify-content:center;padding:24px;' +
						'box-sizing:border-box;text-align:center;font:16px/1.5 system-ui,sans-serif;' +
						'background:' +
						(light ? '#fff' : '#0b0c0e') +
						';color:' +
						(light ? '#1a1a1a' : '#e6e6e6');
					var title = document.createElement('h1');
					title.style.cssText = 'margin:0 0 8px;font-size:20px;font-weight:600';
					var text = document.createElement('p');
					text.style.cssText = 'margin:0 0 16px;max-width:520px';
					if (kind === 'unsupported') {
						title.textContent = 'Your browser is not supported';
						text.textContent =
							'SigNoz needs a newer browser. Update Chrome, Edge, Firefox or Safari, then reload this page.';
					} else {
						title.textContent = 'SigNoz failed to load';
						text.textContent =
							'Part of the app could not be downloaded. Check your connection and reload the page. If it keeps happening, contact your administrator.';
					}
					box.appendChild(title);
					box.appendChild(text);
					if (kind !== 'unsupported') {
						var reload = document.createElement('button');
						reload.type = 'button';
						reload.textContent = 'Reload';
						reload.setAttribute('data-testid', 'boot-error-reload');
						reload.style.cssText =
							'padding:8px 20px;font:inherit;cursor:pointer;border:1px solid currentColor;border-radius:4px;background:transparent;color:inherit';
						reload.onclick = function () {
							window.location.reload();
						};
						box.appendChild(reload);
					}
					document.body.appendChild(box);
				}
				window.__signozBoot = {
					supported: !!(
						window.HTMLScriptElement &&
						HTMLScriptElement.supports &&
						HTMLScriptElement.supports('importmap')
					),
					fail: function (kind) {
						if (document.body) {
							render(kind);
						} else {
							document.addEventListener('DOMContentLoaded', function () {
								render(kind);
							});
						}
					},
				};
			})();
		</script>
		<meta
			http-equiv="Cache-Control"
			content="no-cache, no-store, must-revalidate, max-age: 0"
		/>
		<meta http-equiv="Pragma" content="no-cache" />
		<meta http-equiv="Expires" content="0" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="preconnect" href="https://cdn.vercel.com" crossorigin />

		<title data-react-helmet="true">
			Open source Observability platform | SigNoz
		</title>
		<meta
			data-react-helmet="true"
			property="og:title"
			content="Open source Observability platform | SigNoz"
		/>
		<meta
			data-react-helmet="true"
			name="description"
			content="SigNoz is an open source observability platform to help you find issues in your deployed applications & solve them quickly. It provides a single pane of glass for metrics, traces and logs with deep filtering and aggregation to pin down specific issues very quickly."
		/>
		<meta
			data-react-helmet="true"
			property="og:description"
			content="SigNoz is an open source observability platform to help you find issues in your deployed applications & solve them quickly. It provides a single pane of glass for metrics, traces and logs with deep filtering and aggregation to pin down specific issues very quickly."
		/>
		<meta
			data-react-helmet="true"
			property="og:image"
			content="[[.BaseHref]]images/signoz-hero-image.webp"
		/>
		<meta
			data-react-helmet="true"
			name="twitter:image"
			content="[[.BaseHref]]images/signoz-hero-image.webp"
		/>
		<meta
			data-react-helmet="true"
			name="twitter:image:alt"
			content="Image for Open source Observability platform | SigNoz"
		/>
		<meta
			data-react-helmet="true"
			name="twitter:card"
			content="summary_large_image"
		/>
		<meta data-react-helmet="true" name="docusaurus_locale" content="en" />
		<meta data-react-helmet="true" name="docusaurus_tag" content="default" />
		<meta name="robots" content="noindex" />
		<link data-react-helmet="true" rel="shortcut icon" href="favicon.ico" />
	</head>
	<body data-theme="default">
		<script>
			// Apply theme class synchronously before React renders to prevent flash.
			// Mirrors the logic in ThemeProvider (hooks/useDarkMode/index.tsx).
			(function () {
				try {
					// When served under a URL prefix (e.g. /signoz/), storage keys are scoped
					// to that prefix by the React app (see utils/storage.ts getScopedKey).
					// Read the <base> tag — already populated by the Go template — to derive
					// the same prefix here, before any JS module has loaded.
					var basePath =
						(document.querySelector('base') || {}).getAttribute('href') || '/';
					var prefix = basePath === '/' ? '' : basePath;
					var theme = localStorage.getItem(prefix + 'THEME');
					var autoSwitch =
						localStorage.getItem(prefix + 'THEME_AUTO_SWITCH') === 'true';
					if (autoSwitch) {
						theme = window.matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light';
					}
					if (theme === 'light') {
						document.body.classList.add('lightMode');
					} else {
						// Default to dark when no preference is stored
						document.body.classList.add('dark', 'darkMode');
					}
				} catch (e) {
					document.body.classList.add('dark', 'darkMode');
				}
			})();
		</script>
		<script type="application/json" id="signoz-boot-settings">
			[[.Settings]]
		</script>
		<script>
			try {
				var _el = document.getElementById('signoz-boot-settings');
				window.signozBootData = {
					settings: _el ? JSON.parse(_el.textContent) : null,
				};
			} catch (e) {
				window.signozBootData = { settings: null };
			}
		</script>
		<noscript>You need to enable JavaScript to run this app.</noscript>
		<div id="root"></div>

		<script>
			var pylonSettings =
				((window.signozBootData || {}).settings || {}).pylon || {};
			var pylonEnabled = pylonSettings.enabled === true;
			if (pylonSettings.appId && pylonEnabled) {
				(function () {
					var e = window;
					var t = document;
					var n = function () {
						n.e(arguments);
					};
					n.q = [];
					n.e = function (e) {
						n.q.push(e);
					};
					e.Pylon = n;
					var r = function () {
						var e = t.createElement('script');
						e.setAttribute('type', 'text/javascript');
						e.setAttribute('async', 'true');
						e.setAttribute(
							'src',
							'https://widget.usepylon.com/widget/' + pylonSettings.appId,
						);
						var n = t.getElementsByTagName('script')[0];
						n.parentNode.insertBefore(e, n);
					};
					if (t.readyState === 'complete') {
						r();
					} else if (e.addEventListener) {
						e.addEventListener('load', r, false);
					}
				})();
			}
		</script>
		<script type="text/javascript">
			window.AppcuesSettings = { enableURLDetection: true };
		</script>
		<script>
			var appcuesSettings =
				((window.signozBootData || {}).settings || {}).appcues || {};
			var appcuesEnabled = appcuesSettings.enabled === true;
			if (appcuesSettings.appId && appcuesEnabled) {
				(function (d, t) {
					var a = d.createElement(t);
					a.async = 1;
					a.src = '//fast.appcues.com/' + appcuesSettings.appId + '.js';
					var s = d.getElementsByTagName(t)[0];
					s.parentNode.insertBefore(a, s);
				})(document, 'script');
			}
		</script>
		<script type="module" src="./src/index.tsx"></script>
	</body>
</html>
