name: jsci

on:
  pull_request:
    branches:
      - main
  pull_request_target:
    types:
      - labeled
  merge_group:
    types:
      - checks_requested

jobs:
  tsc:
    if: |
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && ! github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]' && ! contains(github.event.pull_request.labels.*.name, 'safe-to-test')) ||
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe-to-test'))
    uses: signoz/primus.workflows/.github/workflows/js-tsc.yaml@main
    secrets: inherit
    with:
      PRIMUS_REF: main
      JS_SRC: frontend
      JS_PKG_MANAGER: pnpm
  test-shard:
    if: |
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && ! github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]' && ! contains(github.event.pull_request.labels.*.name, 'safe-to-test')) ||
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe-to-test'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'merge_group' && '[1, 2, 3]' || '[1]') }}
    steps:
      - name: self-checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: ${{ github.event_name == 'merge_group' && 1 || 0 }}
          filter: blob:none
      - name: install-pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: node-install
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: install-frontend
        run: cd frontend && pnpm install
      - name: test
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          cd frontend
          # Changes to these reach every test without any test importing them.
          RUN_ALL='^(\.github/workflows/jsci\.yaml|frontend/(jest\.(config\.ts|setup\.ts|environment\.cjs)|package\.json|pnpm-lock\.yaml|tsconfig[^/]*\.json|babel\.config\.cjs|__mocks__/|src/mocks-server/))'
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null &&
            ! git diff --name-only "$BASE_SHA...HEAD" | grep -qE "$RUN_ALL"; then
            pnpm test --changedSince="$BASE_SHA" --passWithNoTests
          else
            pnpm test --shard="$SHARD"
          fi
  # Branch protection requires a check named "test / js"; this job keeps that name stable across shard changes.
  test:
    name: test / js
    needs: test-shard
    if: always() && needs.test-shard.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: shards-passed
        run: test "${{ needs.test-shard.result }}" = success
  fmt:
    if: |
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && ! github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]' && ! contains(github.event.pull_request.labels.*.name, 'safe-to-test')) ||
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe-to-test'))
    uses: signoz/primus.workflows/.github/workflows/js-fmt.yaml@main
    secrets: inherit
    with:
      PRIMUS_REF: main
      JS_SRC: frontend
      JS_PKG_MANAGER: pnpm
  lint:
    if: |
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && ! github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]' && ! contains(github.event.pull_request.labels.*.name, 'safe-to-test')) ||
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe-to-test'))
    uses: signoz/primus.workflows/.github/workflows/js-lint.yaml@main
    secrets: inherit
    with:
      PRIMUS_REF: main
      JS_SRC: frontend
      JS_PKG_MANAGER: pnpm
  openapi:
    if: |
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && ! github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]' && ! contains(github.event.pull_request.labels.*.name, 'safe-to-test')) ||
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe-to-test'))
    runs-on: ubuntu-latest
    steps:
      - name: self-checkout
        uses: actions/checkout@v4
      - name: node-install
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: install-pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: install-frontend
        run: cd frontend && pnpm install
      - name: generate-api-clients
        run: |
          cd frontend && pnpm generate:api
          git diff --compact-summary --exit-code || (echo; echo "Unexpected difference in generated api clients. Run pnpm generate:api in frontend/ locally and commit."; exit 1)
  storybook:
    if: |
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && ! github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]' && ! contains(github.event.pull_request.labels.*.name, 'safe-to-test')) ||
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe-to-test'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: self-checkout
        uses: actions/checkout@v4
      - name: install-pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: node-install
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: install-frontend
        run: cd frontend && pnpm install
      - name: test-storybook
        run: cd frontend && pnpm test:storybook --shard=${{ matrix.shard }}/${{ strategy.job-total }}
  web-settings:
    if: |
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && ! github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]' && ! contains(github.event.pull_request.labels.*.name, 'safe-to-test')) ||
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe-to-test'))
    runs-on: ubuntu-latest
    steps:
      - name: self-checkout
        uses: actions/checkout@v4
      - name: node-install
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: install-pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: install-frontend
        run: cd frontend && pnpm install
      - name: generate-web-settings
        run: |
          cd frontend && pnpm generate:config:web-settings
          git diff --compact-summary --exit-code || (echo; echo "Unexpected difference in generated web settings types. Run pnpm generate:config:web-settings in frontend/ locally and commit."; exit 1)
  geo-outlines:
    if: |
      (github.event_name == 'pull_request' && ! github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]' && ! contains(github.event.pull_request.labels.*.name, 'safe-to-test')) ||
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe-to-test'))
    runs-on: ubuntu-latest
    steps:
      - name: self-checkout
        uses: actions/checkout@v4
      - name: node-install
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: install-pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: install-frontend
        run: cd frontend && pnpm install
      - name: generate-geo-outlines
        run: |
          cd frontend && pnpm build:geo-outlines
          git status --short
          test -z "$(git status --porcelain)" || (echo; echo "Unexpected difference in geo map outlines. Run pnpm build:geo-outlines in frontend/ locally and commit."; exit 1)
