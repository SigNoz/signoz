name: jsci

on:
  pull_request:
    branches:
      - main
  pull_request_target:
    types:
      - labeled
  merge_group:
    types:
      - checks_requested

jobs:
  tsc:
    if: |
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && ! github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]' && ! contains(github.event.pull_request.labels.*.name, 'safe-to-test')) ||
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe-to-test'))
    uses: signoz/primus.workflows/.github/workflows/js-tsc.yaml@main
    secrets: inherit
    with:
      PRIMUS_REF: main
      JS_SRC: frontend
      JS_PKG_MANAGER: pnpm
  test:
    if: |
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && ! github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]' && ! contains(github.event.pull_request.labels.*.name, 'safe-to-test')) ||
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe-to-test'))
    uses: signoz/primus.workflows/.github/workflows/js-test.yaml@main
    secrets: inherit
    with:
      PRIMUS_REF: main
      JS_SRC: frontend
      JS_PKG_MANAGER: pnpm
  fmt:
    if: |
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && ! github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]' && ! contains(github.event.pull_request.labels.*.name, 'safe-to-test')) ||
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe-to-test'))
    uses: signoz/primus.workflows/.github/workflows/js-fmt.yaml@main
    secrets: inherit
    with:
      PRIMUS_REF: main
      JS_SRC: frontend
      JS_PKG_MANAGER: pnpm
  lint:
    if: |
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && ! github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]' && ! contains(github.event.pull_request.labels.*.name, 'safe-to-test')) ||
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe-to-test'))
    uses: signoz/primus.workflows/.github/workflows/js-lint.yaml@main
    secrets: inherit
    with:
      PRIMUS_REF: main
      JS_SRC: frontend
      JS_PKG_MANAGER: pnpm
  openapi:
    if: |
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && ! github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]' && ! contains(github.event.pull_request.labels.*.name, 'safe-to-test')) ||
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe-to-test'))
    runs-on: ubuntu-latest
    steps:
      - name: self-checkout
        uses: actions/checkout@v4
      - name: node-install
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: install-pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: install-frontend
        run: cd frontend && pnpm install
      - name: generate-api-clients
        run: |
          cd frontend && pnpm generate:api
          git diff --compact-summary --exit-code || (echo; echo "Unexpected difference in generated api clients. Run pnpm generate:api in frontend/ locally and commit."; exit 1)
  storybook-build:
    if: |
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && ! github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]' && ! contains(github.event.pull_request.labels.*.name, 'safe-to-test')) ||
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe-to-test'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.select-stories.outputs.shards }}
    steps:
      - name: self-checkout
        uses: actions/checkout@v4
        with:
          # The pull_request merge commit and its first parent, the base branch.
          fetch-depth: 2
      - name: install-pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: node-install
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: install-frontend
        run: cd frontend && pnpm install
      - name: build-storybook
        run: |
          cd frontend
          mkdir -p storybook-stats
          pnpm storybook:build --quiet --stats-json storybook-stats
      - name: select-stories
        id: select-stories
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          cd frontend
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD | node scripts/select-stories.mjs storybook-stats/preview-stats.json > storybook-stories.txt
          else
            node scripts/select-stories.mjs --all storybook-stats/preview-stats.json > storybook-stories.txt
          fi
          count=$(grep -c . storybook-stories.txt || true)
          shard_count=$(( count > 80 ? 4 : (count + 19) / 20 ))
          echo "Testing $count story files on $shard_count shards"
          cat storybook-stories.txt
          echo "shards=[$(seq -s, 1 "$shard_count")]" >> "$GITHUB_OUTPUT"
      - name: upload-storybook
        if: steps.select-stories.outputs.shards != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          retention-days: 1
          path: |
            frontend/storybook-static
            frontend/storybook-stories.txt
  storybook:
    needs: storybook-build
    if: needs.storybook-build.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.storybook-build.outputs.shards) }}
    steps:
      - name: self-checkout
        uses: actions/checkout@v4
      - name: install-pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: node-install
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: install-frontend
        run: cd frontend && pnpm install
      - name: download-storybook
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: frontend
      - name: test-storybook
        shell: bash
        env:
          STORYBOOK_STATIC_DIR: storybook-static
        run: |
          cd frontend
          mapfile -t stories < storybook-stories.txt
          pnpm test:storybook --shard=${{ matrix.shard }}/${{ strategy.job-total }} "${stories[@]}"
  web-settings:
    if: |
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && ! github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]' && ! contains(github.event.pull_request.labels.*.name, 'safe-to-test')) ||
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe-to-test'))
    runs-on: ubuntu-latest
    steps:
      - name: self-checkout
        uses: actions/checkout@v4
      - name: node-install
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: install-pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: install-frontend
        run: cd frontend && pnpm install
      - name: generate-web-settings
        run: |
          cd frontend && pnpm generate:config:web-settings
          git diff --compact-summary --exit-code || (echo; echo "Unexpected difference in generated web settings types. Run pnpm generate:config:web-settings in frontend/ locally and commit."; exit 1)
  geo-outlines:
    if: |
      (github.event_name == 'pull_request' && ! github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]' && ! contains(github.event.pull_request.labels.*.name, 'safe-to-test')) ||
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe-to-test'))
    runs-on: ubuntu-latest
    steps:
      - name: self-checkout
        uses: actions/checkout@v4
      - name: node-install
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: install-pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: install-frontend
        run: cd frontend && pnpm install
      - name: generate-geo-outlines
        run: |
          cd frontend && pnpm build:geo-outlines
          git status --short
          test -z "$(git status --porcelain)" || (echo; echo "Unexpected difference in geo map outlines. Run pnpm build:geo-outlines in frontend/ locally and commit."; exit 1)
