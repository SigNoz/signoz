name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # paths-filter butuh history lengkap untuk banding commit dengan benar
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - '!frontend/**'

  frontend-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Unit test (changed only) — untuk feedback cepat di PR
        if: github.event_name == 'pull_request'
        run: yarn test --ci --coverage --changedSince=origin/${{ github.base_ref }}

      - name: Unit test (full suite) — safety net saat push ke main/develop
        if: github.event_name == 'push'
        run: yarn test --ci --coverage

      - name: Build
        run: yarn build

  backend-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Lint (golangci-lint)
        # Pakai .golangci.yml yang sudah ada di root repo (dari upstream SigNoz) —
        # config ini sudah exclude grammar/generated code & legacy findings yang
        # sebelumnya bikin `go vet` manual noise (Seek signature, copylocks, dll).
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Build
        run: go build ./...

      - name: Unit test
        run: go test -race -cover ./...

  # Gate job — INI yang didaftarkan sebagai required status check di branch protection,
  # bukan job frontend-test/backend-test secara langsung. Supaya PR yang cuma ubah
  # salah satu sisi (FE-only atau BE-only) tidak nyangkut menunggu job yang tidak pernah jalan.
  ci-status:
    needs: [detect-changes, frontend-test, backend-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check overall result
        run: |
          if [[ "${{ needs.frontend-test.result }}" == "failure" || "${{ needs.backend-test.result }}" == "failure" ]]; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed"

      - name: Notify Slack on failure
        if: failure() && vars.SLACK_NOTIFICATIONS_ENABLED == 'true'
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "CI gagal di PR #${{ github.event.pull_request.number || github.run_id }} (${{ github.repository }}) — cek: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL }}
