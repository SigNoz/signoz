name: e2elabelci

on:
  pull_request_target:
    types:
      - labeled

permissions:
  actions: write

jobs:
  # Re-runs the commit's e2eci run instead of starting a second one, so the
  # commit keeps a single e2e check. Never checks out PR code.
  rerun:
    if: github.event.label.name == 'safe-to-test' || github.event.label.name == 'safe-to-e2e'
    runs-on: ubuntu-latest
    steps:
      - name: rerun
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/e2eci.yaml/runs?event=pull_request&head_sha=$HEAD_SHA&per_page=1" --jq '.workflow_runs[0].id // empty')
          if [ -z "$id" ]; then
            echo "::error::No e2eci run found for $HEAD_SHA."
            exit 1
          fi
          # A labeled re-run changes nothing once e2e has started.
          started() {
            [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" --jq '[.jobs[] | select(.name == "fmtlint" and .conclusion != "skipped")] | length')" -gt 0 ]
          }
          started && exit 0
          gh run watch "$id" --repo "$GITHUB_REPOSITORY" --interval 10 > /dev/null
          started || gh run rerun "$id" --repo "$GITHUB_REPOSITORY"
