name: Release signoz-ob image

# Builds cmd/community/Dockerfile.ob (headless SigNoz on OceanBase for the AI
# Vision stack) for linux/amd64 + linux/arm64 and pushes it to GitHub Container
# Registry as ghcr.io/<owner>/signoz-ob. The upstream build-community.yaml
# (frontend-bundled Docker Hub image) is untouched.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Extra image tag to apply (e.g. dev)
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/signoz-ob

jobs:
  image:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/community/Dockerfile.ob
          # Go is cross-compiled inside the Dockerfile, so both platforms are
          # produced on one amd64 runner without QEMU.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
