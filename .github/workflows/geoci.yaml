name: geoci

on:
  pull_request:
    branches:
      - main
    paths:
      - frontend/scripts/geo-outlines/**
      - frontend/src/lib/visualization/charts/GeoMap/assets/**
      - frontend/src/lib/visualization/charts/GeoMap/geo/subdivisionCountries.ts
      - frontend/pnpm-lock.yaml
  pull_request_target:
    types:
      - labeled
    paths:
      - frontend/scripts/geo-outlines/**
      - frontend/src/lib/visualization/charts/GeoMap/assets/**
      - frontend/src/lib/visualization/charts/GeoMap/geo/subdivisionCountries.ts
      - frontend/pnpm-lock.yaml

jobs:
  geo-outlines:
    if: |
      (github.event_name == 'pull_request' && ! github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]' && ! contains(github.event.pull_request.labels.*.name, 'safe-to-test')) ||
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe-to-test'))
    runs-on: ubuntu-latest
    steps:
      - name: self-checkout
        uses: actions/checkout@v4
      - name: node-install
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: install-pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: install-frontend
        run: cd frontend && pnpm install
      - name: generate-geo-outlines
        run: |
          cd frontend && pnpm build:geo-outlines
          git diff --compact-summary --exit-code || (echo; echo "Unexpected difference in geo map outlines. Run pnpm build:geo-outlines in frontend/ locally and commit."; exit 1)
