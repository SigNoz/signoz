name: geoci

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/geoci.yaml
      - frontend/scripts/geo-outlines/**
      - frontend/src/lib/visualization/charts/GeoMap/assets/**
      - frontend/src/lib/visualization/charts/GeoMap/geo/subdivisionCountries.ts

jobs:
  geo-outlines:
    runs-on: ubuntu-latest
    steps:
      - name: self-checkout
        uses: actions/checkout@v4
      - name: node-install
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: install-pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: install-frontend
        run: cd frontend && pnpm install
      - name: generate-geo-outlines
        run: |
          cd frontend && pnpm build:geo-outlines
          git status --short
          test -z "$(git status --porcelain)" || (echo; echo "Unexpected difference in geo map outlines. Run pnpm build:geo-outlines in frontend/ locally and commit."; exit 1)
